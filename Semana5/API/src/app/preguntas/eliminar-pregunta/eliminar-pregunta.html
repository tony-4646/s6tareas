<div class="container my-5">
  <div class="card shadow-sm mx-auto" style="max-width: 550px;">
    <div class="card-header bg-danger text-white">
      <h5 class="mb-0 fw-bold">Confirmar Eliminación</h5>
    </div>
    <div class="card-body p-4 text-center">
      
      <p class="fs-5 text-dark mb-4">
        ¿Estás seguro de que deseas eliminar la pregunta?
      </p>

      @if (pregunta) {
        <div class="alert alert-light border text-start mb-4">
          <div class="mb-2">
            <span class="badge bg-secondary me-2">ID: {{ pregunta.id }}</span>
            <span class="badge bg-dark">Orden: {{ pregunta.orden }}</span>
          </div>
          <h6 class="fw-bold text-danger mb-1">Enunciado:</h6>
          <p class="mb-2 text-dark">{{ pregunta.enunciado }}</p>
          
          <h6 class="fw-bold text-muted mb-1">Descripción:</h6>
          <p class="mb-0 text-secondary small">{{ pregunta.descripcion }}</p>
        </div>
      }

      <div class="d-flex justify-content-center gap-3">
        <button type="button" class="btn btn-secondary px-4" routerLink="/">
          Cancelar
        </button>
        <button type="button" class="btn btn-danger px-4 fw-bold" (click)="confirmarEliminacion()">
          Eliminar
        </button>
      </div>

    </div>
  </div>
</div>
