<div class="login-container">
  <div class="login-card">
    <h2>Iniciar Sesión</h2>

    <form (submit)="onLogin($event)" #loginForm>
      
      <div class="form-group">
        <label for="username">Usuario</label>
        <input
          type="text"
          id="username"
          name="Nombre_Usuario"
          [value]="datosUsuario.Nombre_Usuario"
          (input)="datosUsuario.Nombre_Usuario = $event.target.value"
          required
          placeholder="Ej. usuario123"
          class="form-control"
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="Contrasena"
          [value]="datosUsuario.Contrasena"
          (input)="datosUsuario.Contrasena = $event.target.value"
          required
          placeholder="••••••••"
          class="form-control"
        />
      </div>

      <button
        type="submit"
        class="btn-login"
        [disabled]="!datosUsuario.Nombre_Usuario || !datosUsuario.Contrasena">
        Ingresar
      </button>

    </form>
  </div>
</div>
